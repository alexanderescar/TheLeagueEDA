function aggregateByPerson(rows){
  const by={};
  rows.forEach(r=>{
    const key=r.owner||r.teamName;
    if(!inAllTime(key)) return;
    if(!by[key]) by[key]={name:key, seasons:0, wins:0, losses:0, pf:0, pa:0, champs:0, weekHigh:0};
    const o=by[key];
    o.seasons++; o.wins+=r.wins; o.losses+=r.losses; o.pf+=r.pf; o.pa+=r.pa;
    if(r.isChamp) o.champs++;
    if(r.weekHigh>o.weekHigh) o.weekHigh=r.weekHigh;
  });
  return Object.values(by);
}
let atsSort={col:'winPct',dir:-1};
function sortATS(col){ if(atsSort.col===col) atsSort.dir*=-1; else atsSort={col,dir:(col==='name'?1:-1)}; renderHistAllStandings(buildCrossSeasonStats()); }
function renderHistAllStandings(rows){
  const el=document.getElementById('hist-sub-standings-all'); if(!el) return;
  const people=aggregateByPerson(rows).map(o=>{ const gp=o.wins+o.losses||1; return {...o, gp, winPct:o.wins/gp, ppg:o.pf/gp}; });
  const _c=atsSort.col,_d=atsSort.dir; people.sort((a,b)=>{ if(_c==='name') return a.name.localeCompare(b.name)*_d; return (a[_c]-b[_c])*_d; });
  let h='<div class="table-wrap"><table class="std-table"><thead><tr><th>#</th><th class="sort-th" onclick="sortATS(\'name\')">Manager</th><th class="sort-th" onclick="sortATS(\'seasons\')">Szns</th><th class="sort-th" onclick="sortATS(\'wins\')">W–L</th><th class="sort-th" onclick="sortATS(\'winPct\')">Win %</th><th class="sort-th" onclick="sortATS(\'pf\')">PF</th><th class="sort-th" onclick="sortATS(\'pa\')">PA</th><th class="sort-th" onclick="sortATS(\'ppg\')">PPG</th><th class="sort-th" onclick="sortATS(\'champs\')">Titles</th></tr></thead><tbody>';
  people.forEach((o,i)=>{
    h+=`<tr><td>${i+1}</td><td style="font-weight:600">${nameLink(o.name)}</td><td>${o.seasons}</td><td>${o.wins}–${o.losses}</td><td style="color:var(--gold)">${(o.winPct*100).toFixed(1)}%</td><td>${o.pf.toFixed(0)}</td><td>${o.pa.toFixed(0)}</td><td>${o.ppg.toFixed(1)}</td><td>${o.champs?(o.champs+' 🏆'):'—'}</td></tr>`;
  });
  h+='</tbody></table></div>';
  el.innerHTML=h;
}

// ══════════════════════════════════════════════
//  ALL-TIME HEAD-TO-HEAD GRID (by person)
// ══════════════════════════════════════════════
function renderHistH2HAll(){
  const el=document.getElementById('hist-sub-h2h'); if(!el) return;
  const recs={}; const names=new Set();
  allSeasons.forEach(s=>{
    const map=getTeamsMapFor(s);
    (s.schedule||[]).forEach(m=>{
      const ht=map[m.home?.teamId], at=map[m.away?.teamId];
      if(!ht||!at) return;
      const hs=m.home?.totalPoints??0, as_=m.away?.totalPoints??0;
      if(hs===0&&as_===0) return;
      const hp=mgr(ht), ap=mgr(at);
      if(hp===ap) return;
      if(!inAllTime(hp)||!inAllTime(ap)) return;
      names.add(hp); names.add(ap);
      recs[hp]=recs[hp]||{}; recs[ap]=recs[ap]||{};
      recs[hp][ap]=recs[hp][ap]||{w:0,l:0}; recs[ap][hp]=recs[ap][hp]||{w:0,l:0};
      const w=inferWinner(m);
      if(w==='HOME'){ recs[hp][ap].w++; recs[ap][hp].l++; }
      else if(w==='AWAY'){ recs[ap][hp].w++; recs[hp][ap].l++; }
    });
  });
  const ppl=[...names].sort();
  if(!ppl.length){ el.innerHTML='<p style="color:var(--muted);padding:20px">No matchup data available.</p>'; return; }
  let h='<div class="table-wrap"><table class="h2h-table"><thead><tr><th class="rl">vs →</th>'+ppl.map(p=>`<th>${p}</th>`).join('')+'</tr></thead><tbody>';
  ppl.forEach(rp=>{
    h+=`<tr><td class="rl">${rp}</td>`;
    ppl.forEach(cp=>{
      if(rp===cp){ h+='<td class="h2h-self">—</td>'; return; }
      const rec=recs[rp]&&recs[rp][cp];
      if(!rec||(rec.w===0&&rec.l===0)){ h+='<td style="color:var(--border-bright)">·</td>'; return; }
      const cls=rec.w>rec.l?'h2h-win':rec.w<rec.l?'h2h-loss':'';
      h+=`<td class="${cls}" title="${rp} vs ${cp}: ${rec.w}-${rec.l}">${rec.w}-${rec.l}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table><div class="h2h-note">Rows = manager, columns = opponent. Green = winning record, red = losing record. ESPN era (2011–present).</div></div>';
  el.innerHTML=h;
}

function buildWeeklyAwards(src){
  const map=getTeamsMapFor(src);
  const byWeek={};
  (src.schedule||[]).forEach(m=>{ const wk=m.matchupPeriodId; (byWeek[wk]=byWeek[wk]||[]).push(m); });
  const weeks=Object.keys(byWeek).map(Number).sort((a,b)=>b-a);
  let rows='';
  weeks.forEach(wk=>{
    const ms=byWeek[wk].filter(m=>(m.home?.totalPoints||0)>0||(m.away?.totalPoints||0)>0);
    if(!ms.length) return;
    let hi=0,hiT=null, lo=Infinity,loT=null, big=0,bigW=null,bigL=null, close=Infinity,clW=null,clL=null;
    ms.forEach(m=>{
      const ht=map[m.home?.teamId], at=map[m.away?.teamId]; if(!ht||!at) return;
      const hs=m.home?.totalPoints??0, as_=m.away?.totalPoints??0;
      if(hs>hi){ hi=hs; hiT=ht; } if(as_>hi){ hi=as_; hiT=at; }
      if(hs<lo){ lo=hs; loT=ht; } if(as_<lo){ lo=as_; loT=at; }
      const w=inferWinner(m)==='HOME'; const mar=Math.abs(hs-as_);
      if(mar>big){ big=mar; bigW=w?ht:at; bigL=w?at:ht; }
      if(mar<close&&mar>0){ close=mar; clW=w?ht:at; clL=w?at:ht; }
    });
    rows+=`<div class="wk-awards"><div class="wk-awards-h">Week ${wk}</div><div class="wk-awards-grid">`+
      `<div class="wka"><span class="wka-l">🔥 Top Score</span><span class="wka-w">${hiT?mgr(hiT):'—'}</span><span class="wka-d">${hi?hi.toFixed(1):''}</span></div>`+
      `<div class="wka"><span class="wka-l">💥 Blowout</span><span class="wka-w">${bigW?mgr(bigW):'—'}</span><span class="wka-d">${bigW?('+'+big.toFixed(1)+' over '+mgr(bigL)):''}</span></div>`+
      `<div class="wka"><span class="wka-l">⏱️ Nail-biter</span><span class="wka-w">${clW?mgr(clW):'—'}</span><span class="wka-d">${clW?('by '+close.toFixed(1)+' over '+mgr(clL)):''}</span></div>`+
      `<div class="wka"><span class="wka-l">🧊 Bust</span><span class="wka-w">${loT?mgr(loT):'—'}</span><span class="wka-d">${lo===Infinity?'':lo.toFixed(1)}</span></div>`+
      `</div></div>`;
  });
  if(!rows) rows='<div class="empty-msg"><div class="eicon">🏈</div><p>No completed weeks yet — weekly awards fill in as the season is played.</p></div>';
  return `<div class="card"><div class="card-header"><div class="card-title">Weekly Awards</div><div class="card-sub">${src.season} · week by week</div></div>${rows}</div>`;
}

      ${(function(){ const ap=buildAllPlay().list.find(x=>x.nick===nick); if(!ap) return '';

        return '<div class="pstat"><div class="pstat-l">All-Play</div><div class="pstat-v">'+(ap.apPct*100).toFixed(1)+'%</div></div>'+

    </div></div>`;
  // season by season
  h+='<div class="card"><div class="card-header"><div class="card-title">Season by Season</div></div><div class="table-wrap"><table class="std-table"><thead><tr><th>Year</th><th>Team</th><th>W–L</th><th>Finish</th><th>PF</th><th>PA</th></tr></thead><tbody>';

  if(opps.length){
    h+='<div class="card"><div class="card-header"><div class="card-title">Head-to-Head</div><div class="card-sub">Lifetime vs each manager</div></div><div class="h2h-list">';

// Managers excluded from ALL-TIME aggregates (single-season cameos).
// Their season-level stats stay intact everywhere.
var ALLTIME_EXCLUDE=['Angel','Viscon'];
function inAllTime(n){ return ALLTIME_EXCLUDE.indexOf(n)===-1; }
function titleGameFor(s){
  if(!s) return null;
  const champ=s.teams.find(t=>t.rankCalculatedFinal===1);
  const ru=s.teams.find(t=>t.rankCalculatedFinal===2);
  if(!champ||!ru) return null;
  let best=null;
  (s.schedule||[]).forEach(m=>{
    const h=m.home&&m.home.teamId, a=m.away&&m.away.teamId;
    const hp=(m.home&&m.home.totalPoints)||0, ap=(m.away&&m.away.totalPoints)||0;
    if(hp===0&&ap===0) return;
    if((h===champ.id&&a===ru.id)||(h===ru.id&&a===champ.id)){
      if(!best||m.matchupPeriodId>best.wk){
        best={wk:m.matchupPeriodId,
              champScore:(h===champ.id)?hp:ap,
              ruScore:(h===champ.id)?ap:hp};
      }
    }
  });
  if(!best) return null;
  best.champ=mgr(champ); best.champTeam=tName(champ);
  best.ru=mgr(ru); best.ruTeam=tName(ru);
  best.margin=best.champScore-best.ruScore;
  return best;
}
function regWeeksFor(s){
  const n = s && s.settings && s.settings.scheduleSettings && s.settings.scheduleSettings.matchupPeriodCount;
  return (typeof n==='number' && n>0) ? n : 99;
}
let _apCache=null;
function buildAllPlay(){
  if(_apCache) return _apCache;
  const person={};   // nick -> totals
  const seasonRows=[]; // {season,nick,aw,al,at,w,l,gp}
  const P=(n)=>person[n]||(person[n]={nick:n,aw:0,al:0,at:0,w:0,l:0,gp:0,seasons:0,oppSum:0,ownSum:0});
  allSeasons.forEach(s=>{
    const map=getTeamsMapFor(s);
    const cutoff=regWeeksFor(s);
    const byWk={};
    (s.schedule||[]).forEach(m=>{
      const wk=m.matchupPeriodId;
      if(!(wk<=cutoff)) return;
      const hs=m.home&&m.home.totalPoints, as_=m.away&&m.away.totalPoints;
      if(!((hs>0)||(as_>0))) return;
      (byWk[wk]=byWk[wk]||[]).push(m);
    });
    const local={};
    Object.keys(byWk).forEach(wk=>{
      const ms=byWk[wk];
      const entries=[];
      ms.forEach(m=>{
        const ht=map[m.home&&m.home.teamId], at2=map[m.away&&m.away.teamId];
        if(!ht||!at2) return;
        const hp=m.home.totalPoints||0, ap=m.away.totalPoints||0;
        entries.push({nick:mgr(ht),pts:hp,opp:mgr(at2),oppPts:ap});
        entries.push({nick:mgr(at2),pts:ap,opp:mgr(ht),oppPts:hp});
      });
      entries.forEach(e=>{
        let aw=0,al=0,at=0;
        entries.forEach(o=>{ if(o===e) return;
          if(e.pts>o.pts)aw++; else if(e.pts<o.pts)al++; else at++; });
        const L=local[e.nick]||(local[e.nick]={aw:0,al:0,at:0,w:0,l:0,gp:0,oppSum:0,ownSum:0});
        L.aw+=aw; L.al+=al; L.at+=at; L.gp++; L.oppSum+=e.oppPts; L.ownSum+=e.pts;
        if(e.pts>e.oppPts)L.w++; else if(e.pts<e.oppPts)L.l++;
      });
    });
    Object.keys(local).forEach(n=>{
      const L=local[n]; const p=P(n);
      p.aw+=L.aw;p.al+=L.al;p.at+=L.at;p.w+=L.w;p.l+=L.l;p.gp+=L.gp;p.seasons++;p.oppSum+=L.oppSum;p.ownSum+=L.ownSum;
      seasonRows.push({season:s.season,nick:n,...L});
    });
  });
  let _tp=0,_tg=0; Object.values(person).forEach(p=>{_tp+=p.ownSum;_tg+=p.gp;});
  const leagueAvgPPG=_tg?_tp/_tg:0;
  const list=Object.values(person).filter(function(p){return inAllTime(p.nick);}).map(p=>{
    const apg=p.aw+p.al+p.at||1;
    const apPct=(p.aw+p.at*0.5)/apg;
    const expW=apPct*p.gp;
    const oppPPG=p.gp?p.oppSum/p.gp:0;
    return {...p, apPct, expW, luck:p.w-expW, winPct:p.gp?p.w/p.gp:0, oppPPG, sos:oppPPG-leagueAvgPPG, leagueAvgPPG};
  });
  seasonRows.forEach(r=>{
    r.oppPPG=r.gp?r.oppSum/r.gp:0;
    const apg=r.aw+r.al+r.at||1;
    r.apPct=(r.aw+r.at*0.5)/apg;
    r.expW=r.apPct*r.gp;
    r.luck=r.w-r.expW;
  });
  _apCache={list,seasonRows:seasonRows.filter(function(r){return inAllTime(r.nick);})};
  return _apCache;
}
let apSort={col:'luck',dir:-1};
function sortAP(c){ if(apSort.col===c) apSort.dir*=-1; else apSort={col:c,dir:(c==='nick'?1:-1)}; renderHistAllPlay(); }

  h+='<div class="lucky-row">'+

  h+='<div class="lucky-row">'+

  h+='<div class="table-wrap"><table class="std-table"><thead><tr>'+

  rows.forEach((r,i)=>{

    h+=`<tr><td>${i+1}</td><td style="font-weight:600">${nameLink(r.nick)}</td><td>${r.w}–${r.l}</td>`+

       `<td class="${lc}">${r.luck>0?'+':''}${r.luck.toFixed(1)}</td></tr>`;

// ── Rivalries ──────────────────────────────────
function buildRivalries(){
  const pairs={};
  allSeasons.forEach(s=>{
    const map=getTeamsMapFor(s);
    (s.schedule||[]).forEach(m=>{
      const ht=map[m.home&&m.home.teamId], at=map[m.away&&m.away.teamId];
      if(!ht||!at) return;
      const hp=m.home.totalPoints||0, ap=m.away.totalPoints||0;
      if(hp===0&&ap===0) return;
      const A=mgr(ht),B=mgr(at); if(A===B) return;
      const key=[A,B].sort().join(' ↔ ');
      const p=pairs[key]||(pairs[key]={key,a:[A,B].sort()[0],b:[A,B].sort()[1],games:0,aw:0,bw:0,ties:0,marginSum:0,big:null,log:[]});
      p.games++;
      const aPts=(A===p.a)?hp:ap, bPts=(A===p.a)?ap:hp;
      const marg=Math.abs(aPts-bPts);
      p.marginSum+=marg;
      let winner=null;
      if(aPts>bPts){p.aw++;winner=p.a;} else if(bPts>aPts){p.bw++;winner=p.b;} else p.ties++;
      if(!p.big||marg>p.big.marg) p.big={marg,winner,loser:winner===p.a?p.b:p.a,season:s.season,wk:m.matchupPeriodId,ws:Math.max(aPts,bPts),ls:Math.min(aPts,bPts)};
      p.log.push({season:s.season,wk:m.matchupPeriodId,winner});
    });
  });
  const list=Object.values(pairs).map(p=>{
    p.avgMarg=p.marginSum/(p.games||1);
    p.diff=Math.abs(p.aw-p.bw);
    p.log.sort((x,y)=> x.season-y.season || x.wk-y.wk);
    let st=0,who=null;
    for(let i=p.log.length-1;i>=0;i--){ const w=p.log[i].winner; if(!w) break; if(who===null){who=w;st=1;} else if(w===who) st++; else break; }
    p.streak=st; p.streakWho=who;
    return p;
  });
  return list;
}
function renderHistRivalries(){
  const el=document.getElementById('hist-sub-rivalries'); if(!el) return;
  const all=buildRivalries().filter(p=>p.games>=4);
  if(!all.length){ el.innerHTML='<p style="color:var(--muted);padding:20px">Not enough matchup data.</p>'; return; }
  const closest=[...all].sort((a,b)=> a.diff-b.diff || b.games-a.games)[0];
  const lopsided=[...all].sort((a,b)=> (b.diff/b.games)-(a.diff/a.games) || b.games-a.games)[0];
  const mostPlayed=[...all].sort((a,b)=>b.games-a.games)[0];
  const bloodbath=[...all].sort((a,b)=>b.big.marg-a.big.marg)[0];
  const tightest=[...all].sort((a,b)=>a.avgMarg-b.avgMarg)[0];
  const card=(t,n,v,d)=>`<div class="riv-card"><div class="riv-l">${t}</div><div class="riv-n">${n}</div><div class="riv-v">${v}</div><div class="riv-d">${d}</div></div>`;
  let h='<div class="riv-grid">';
  h+=card('⚖️ Dead-Even Rivalry',closest.key,`${Math.max(closest.aw,closest.bw)}–${Math.min(closest.aw,closest.bw)}`,`${closest.games} meetings, separated by ${closest.diff}`);
  h+=card('🔨 Most Lopsided',`${lopsided.aw>lopsided.bw?lopsided.a:lopsided.b} over ${lopsided.aw>lopsided.bw?lopsided.b:lopsided.a}`,`${Math.max(lopsided.aw,lopsided.bw)}–${Math.min(lopsided.aw,lopsided.bw)}`,`${lopsided.games} meetings`);
  h+=card('🤝 Most Played',mostPlayed.key,`${mostPlayed.games} games`,`${mostPlayed.aw}–${mostPlayed.bw}${mostPlayed.ties?('–'+mostPlayed.ties):''} (${mostPlayed.a})`);
  h+=card('💥 Biggest Beatdown',`${bloodbath.big.winner} over ${bloodbath.big.loser}`,`+${bloodbath.big.marg.toFixed(1)}`,`${bloodbath.big.season} Wk ${bloodbath.big.wk} · ${bloodbath.big.ws.toFixed(1)}–${bloodbath.big.ls.toFixed(1)}`);
  h+=card('🔪 Closest Series',tightest.key,`${tightest.avgMarg.toFixed(1)} avg margin`,`${tightest.games} meetings`);
  const hotStreak=[...all].sort((a,b)=>b.streak-a.streak)[0];
  if(hotStreak&&hotStreak.streak>1) h+=card('🔥 Longest Active Streak',hotStreak.streakWho,`${hotStreak.streak} straight`,`over ${hotStreak.streakWho===hotStreak.a?hotStreak.b:hotStreak.a}`);
  h+='</div>';
  const sorted=[...all].sort((a,b)=>b.games-a.games);
  h+='<div class="table-wrap"><table class="std-table"><thead><tr><th>Rivalry</th><th>Record</th><th>Games</th><th>Avg Margin</th><th>Biggest Win</th></tr></thead><tbody>';
  sorted.forEach(p=>{
    const lead=p.aw>p.bw?`${p.a} leads`:p.bw>p.aw?`${p.b} leads`:'even';
    h+=`<tr><td style="font-weight:600">${nameLink(p.a)} <span style="color:var(--muted)">vs</span> ${nameLink(p.b)}</td>`+
       `<td>${p.aw}–${p.bw}${p.ties?('–'+p.ties):''} <span style="color:var(--muted);font-size:11px">${lead}</span></td>`+
       `<td>${p.games}</td><td>${p.avgMarg.toFixed(1)}</td>`+
       `<td style="font-size:12px">${p.big.winner} +${p.big.marg.toFixed(1)} <span style="color:var(--muted)">(${p.big.season})</span></td></tr>`;
  });
  h+='</tbody></table></div>';
  el.innerHTML=h;
}

//  RECAPS (templated narrative, no AI)

function pickV(arr,seed){ return arr[Math.abs(seed)%arr.length]; }
function renderRecaps(){
  const el=document.getElementById('tab-recaps'); if(!el) return;
  const src=allSeasons[0]; if(!src){ el.innerHTML=''; return; }
  const map=getTeamsMapFor(src);
  const cutoff=regWeeksFor(src);
  const byWk={};
  (src.schedule||[]).forEach(m=>{
    const hs=m.home&&m.home.totalPoints, as_=m.away&&m.away.totalPoints;
    if(!((hs>0)||(as_>0))) return;
    (byWk[m.matchupPeriodId]=byWk[m.matchupPeriodId]||[]).push(m);
  });
  const weeks=Object.keys(byWk).map(Number).sort((a,b)=>b-a);
  let h=`<div class="card"><div class="card-header"><div class="card-title">Season Recaps</div><div class="card-sub">${src.season} · auto-written from the box scores</div></div>`;
  if(!weeks.length){
    h+='<div class="empty-msg"><div class="eicon">📰</div><p>No games played yet. Recaps write themselves as the season goes.</p></div></div>';
    el.innerHTML=h; return;
  }
  weeks.forEach(wk=>{
    const games=byWk[wk].map(m=>{
      const ht=map[m.home&&m.home.teamId], at=map[m.away&&m.away.teamId];
      if(!ht||!at) return null;
      const hp=m.home.totalPoints||0, ap=m.away.totalPoints||0;
      const hw=hp>=ap;
      return {w:hw?mgr(ht):mgr(at), l:hw?mgr(at):mgr(ht), ws:hw?hp:ap, ls:hw?ap:hp, marg:Math.abs(hp-ap)};
    }).filter(Boolean);
    if(!games.length) return;
    const scores=[];
    games.forEach(g=>{scores.push({n:g.w,p:g.ws},{n:g.l,p:g.ls});});
    scores.sort((a,b)=>b.p-a.p);
    const top=scores[0], bot=scores[scores.length-1];
    const blow=[...games].sort((a,b)=>b.marg-a.marg)[0];
    const close=[...games].sort((a,b)=>a.marg-b.marg)[0];
    const unlucky=[...games].sort((a,b)=>b.ls-a.ls)[0];
    const avg=scores.reduce((s,x)=>s+x.p,0)/scores.length;
    const isPlayoff=wk>cutoff;
    const lede=pickV([
      `${top.n} set the pace in Week ${wk}, hanging ${top.p.toFixed(1)} on the board.`,
      `Week ${wk} belonged to ${top.n}, whose ${top.p.toFixed(1)} was the number everyone else chased.`,
      `Nobody touched ${top.n} in Week ${wk} — ${top.p.toFixed(1)} points, top of the league.`,
      `${top.n} led all scorers in Week ${wk} with ${top.p.toFixed(1)}.`
    ],wk);
    const blowLine=blow.marg>=40?pickV([
      ` ${blow.w} handled ${blow.l} ${blow.ws.toFixed(1)}–${blow.ls.toFixed(1)}, a ${blow.marg.toFixed(1)}-point statement.`,
      ` The week's beatdown went to ${blow.w}, who put ${blow.marg.toFixed(1)} on ${blow.l}.`,
      ` ${blow.l} never had a chance — ${blow.w} won by ${blow.marg.toFixed(1)}.`
    ],wk+1):pickV([
      ` The widest margin was ${blow.w} over ${blow.l} by ${blow.marg.toFixed(1)}.`,
      ` ${blow.w}'s ${blow.marg.toFixed(1)}-point win over ${blow.l} was as lopsided as it got.`
    ],wk+1);
    const closeLine=close.marg<=5?pickV([
      ` On the other end, ${close.w} survived ${close.l} by ${close.marg.toFixed(1)} — the kind of loss that ruins a week.`,
      ` ${close.w} edged ${close.l} by ${close.marg.toFixed(1)}. Somewhere, a bench player is being blamed.`,
      ` ${close.w} escaped ${close.l} by ${close.marg.toFixed(1)} points.`
    ],wk+2):` ${close.w} beat ${close.l} by ${close.marg.toFixed(1)} in the week's tightest game.`;
    const unluckyLine=(unlucky.ls>avg)?pickV([
      ` Spare a thought for ${unlucky.l}, who scored ${unlucky.ls.toFixed(1)} — above the weekly average — and still lost.`,
      ` ${unlucky.l} put up ${unlucky.ls.toFixed(1)} and got nothing for it.`,
      ` Tough luck for ${unlucky.l}: ${unlucky.ls.toFixed(1)} points, zero wins.`
    ],wk+3):'';
    const botLine=pickV([
      ` ${bot.n} brought up the rear with ${bot.p.toFixed(1)}.`,
      ` At the bottom, ${bot.n} managed just ${bot.p.toFixed(1)}.`,
      ` ${bot.n} would like Week ${wk} back — ${bot.p.toFixed(1)} points.`
    ],wk+4);
    h+=`<div class="recap">
      <div class="recap-h">${isPlayoff?'Playoffs · ':''}Week ${wk}<span class="recap-avg">league avg ${avg.toFixed(1)}</span></div>
      <p class="recap-b">${lede}${blowLine}${closeLine}${unluckyLine}${botLine}</p>
      <div class="recap-chips">
        <span class="rchip"><b>🔥 High</b> ${top.n} ${top.p.toFixed(1)}</span>
        <span class="rchip"><b>💥 Blowout</b> ${blow.w} +${blow.marg.toFixed(1)}</span>
        <span class="rchip"><b>⏱️ Closest</b> ${close.w} +${close.marg.toFixed(1)}</span>
        <span class="rchip"><b>🧊 Low</b> ${bot.n} ${bot.p.toFixed(1)}</span>
      </div></div>`;
  });
  h+='</div>';
  el.innerHTML=h;
}

// ── Extra all-time game-level records ──────────
function extraRecordRows(){
  let blow=null, highLoss=null, lowWin=null, closest=null;
  const seq={};
  allSeasons.forEach(s=>{
    const map=getTeamsMapFor(s);
    const ms=(s.schedule||[]).slice().sort((a,b)=>(a.matchupPeriodId||0)-(b.matchupPeriodId||0));
    ms.forEach(m=>{
      const ht=map[m.home&&m.home.teamId], at=map[m.away&&m.away.teamId];
      if(!ht||!at) return;
      const hp=m.home.totalPoints||0, ap=m.away.totalPoints||0;
      if(hp===0&&ap===0) return;
      const hw=hp>ap;
      const W=hw?mgr(ht):mgr(at), L=hw?mgr(at):mgr(ht);
      const ws=Math.max(hp,ap), ls=Math.min(hp,ap), marg=ws-ls;
      const rec={W,L,ws,ls,marg,season:s.season,wk:m.matchupPeriodId};
      if(!blow||marg>blow.marg) blow=rec;
      if(!highLoss||ls>highLoss.ls) highLoss=rec;
      if(!lowWin||ws<lowWin.ws) lowWin=rec;
      if(marg>0&&(!closest||marg<closest.marg)) closest=rec;
      if(hp!==ap){
        [[W,1],[L,0]].forEach(([n,win])=>{
          const q=seq[n]||(seq[n]={cur:0,best:0,bestEnd:null,curL:0,worst:0,worstEnd:null});
          if(win){ q.cur++; q.curL=0; if(q.cur>q.best){q.best=q.cur;q.bestEnd=s.season;} }
          else { q.curL++; q.cur=0; if(q.curL>q.worst){q.worst=q.curL;q.worstEnd=s.season;} }
        });
      }
    });
  });
  const streakBest=Object.entries(seq).map(([n,q])=>({n,v:q.best,end:q.bestEnd})).sort((a,b)=>b.v-a.v)[0];
  const streakWorst=Object.entries(seq).map(([n,q])=>({n,v:q.worst,end:q.worstEnd})).sort((a,b)=>b.v-a.v)[0];
  const row=(desc,who,season,val,sub)=>`<tr><td>${desc}</td><td style="font-weight:600">${who}</td><td><span class="season-badge">${season}</span></td><td class="gold-val">${val}</td><td style="color:var(--muted);font-size:12px">${sub||''}</td></tr>`;
  let h='';
  if(blow)      h+=row('💥 Biggest Blowout Ever',blow.W,blow.season,'+'+blow.marg.toFixed(1),`beat ${blow.L} ${blow.ws.toFixed(1)}–${blow.ls.toFixed(1)} (Wk ${blow.wk})`);
  if(closest)   h+=row('🔪 Closest Game Ever',closest.W,closest.season,closest.marg.toFixed(2),`over ${closest.L} (Wk ${closest.wk})`);
  if(highLoss)  h+=row('😤 Highest Score in a Loss',highLoss.L,highLoss.season,highLoss.ls.toFixed(1),`lost to ${highLoss.W} (${highLoss.ws.toFixed(1)})`);
  if(lowWin)    h+=row('🍀 Lowest Score in a Win',lowWin.W,lowWin.season,lowWin.ws.toFixed(1),`beat ${lowWin.L} (${lowWin.ls.toFixed(1)})`);
  if(streakBest)h+=row('🔥 Longest Win Streak',streakBest.n,streakBest.end,streakBest.v+' straight','consecutive wins');
  if(streakWorst)h+=row('🥶 Longest Losing Streak',streakWorst.n,streakWorst.end,streakWorst.v+' straight','consecutive losses');
  return h;
}

// ══════════════════════════════════════════════
//  DRAFT DNA
// ══════════════════════════════════════════════
let _dnaCache=null;
function buildDNA(){
  if(_dnaCache) return _dnaCache;
  const POS=['QB','RB','WR','TE'];
  const ppl={};
  const leaguePlayers={};
  const P=n=>ppl[n]||(ppl[n]={nick:n,drafts:0,picks:0,keepers:0,r1:{},firstRd:{},players:{},teamsByYear:{}});
  allSeasons.forEach(s=>{
    const picks=(s.draftDetail&&s.draftDetail.picks)||[];
    if(!picks.length) return;
    const map=getTeamsMapFor(s);
    const byTeam={};
    picks.forEach(p=>{ (byTeam[p.teamId]=byTeam[p.teamId]||[]).push(p); });
    Object.keys(byTeam).forEach(tid=>{
      const t=map[tid]; if(!t) return;
      const nick=mgr(t); const o=P(nick);
      const list=byTeam[tid].slice().sort((a,b)=>(a.overallPickNumber||0)-(b.overallPickNumber||0));
      o.drafts++; o.picks+=list.length;
      const seen={};
      list.forEach(pk=>{
        if(pk.keeper===true) o.keepers++;
        const pos=pk.playerPosition;
        if(pos&&pos!=='FLEX'){
          if(pk.roundId===1) o.r1[pos]=(o.r1[pos]||0)+1;
          if(POS.indexOf(pos)>-1 && !seen[pos]){ seen[pos]=true; (o.firstRd[pos]=o.firstRd[pos]||[]).push(pk.roundId||0); }
        }
        const key=pk.playerId||pk.playerName;
        if(key&&pk.playerName){
          o.players[key]=o.players[key]||{name:pk.playerName,pos:pos,n:0,years:[]};
          o.players[key].n++; o.players[key].years.push(s.season);
          leaguePlayers[key]=leaguePlayers[key]||{name:pk.playerName,pos:pos,n:0,mgrs:{}};
          leaguePlayers[key].n++; leaguePlayers[key].mgrs[nick]=(leaguePlayers[key].mgrs[nick]||0)+1;
        }
      });
    });
  });
  const list=Object.values(ppl).filter(function(o){return inAllTime(o.nick);}).map(o=>{
    const avg={};
    POS.forEach(p=>{ const a=o.firstRd[p]||[]; avg[p]=a.length? a.reduce((x,y)=>x+y,0)/a.length : null; });
    const fav=Object.values(o.players).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name))[0]||null;
    const r1tot=Object.values(o.r1).reduce((a,b)=>a+b,0)||1;
    const r1top=Object.entries(o.r1).sort((a,b)=>b[1]-a[1])[0];
    return {...o, avgFirst:avg, fav, r1tot, r1top:r1top?{pos:r1top[0],n:r1top[1],pct:r1top[1]/r1tot}:null};
  }).sort((a,b)=>a.nick.localeCompare(b.nick));
  const topPlayers=Object.values(leaguePlayers).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name)).slice(0,12);
  _dnaCache={list,topPlayers};
  return _dnaCache;
}
function renderHistDNA(){
  const el=document.getElementById('hist-sub-dna'); if(!el) return;
  const {list,topPlayers}=buildDNA();
  if(!list.length){ el.innerHTML='<p style="color:var(--muted);padding:20px">No draft data available.</p>'; return; }
  const R=v=>v==null?'—':('R'+v.toFixed(1));
  let h='<div class="ap-note">Sixteen years of draft boards, read back at you. <strong>First QB/RB/WR/TE</strong> is the average round a manager takes that position — the clearest fingerprint of how someone drafts. Positions are ESPN-era (2011–present); 2010 came from Yahoo without position data. Cards require 3+ drafts.</div>';

  // superlatives
  const _el=list.filter(function(x){return x.drafts>=3;});
  const pool=_el.length?_el:list;
  const withQB=pool.filter(x=>x.avgFirst.QB!=null);
  const qbEarly=[...withQB].sort((a,b)=>a.avgFirst.QB-b.avgFirst.QB)[0];
  const qbLate=[...withQB].sort((a,b)=>b.avgFirst.QB-a.avgFirst.QB)[0];
  const withTE=pool.filter(x=>x.avgFirst.TE!=null);
  const teEarly=[...withTE].sort((a,b)=>a.avgFirst.TE-b.avgFirst.TE)[0];
  const keeperKing=[...pool].sort((a,b)=>b.keepers-a.keepers)[0];
  const card=(l,n,v,d)=>`<div class="riv-card"><div class="riv-l">${l}</div><div class="riv-n">${n}</div><div class="riv-v">${v}</div><div class="riv-d">${d}</div></div>`;
  h+='<div class="riv-grid">';
  if(qbEarly) h+=card('\u{1F3C8} Panics at QB',qbEarly.nick,R(qbEarly.avgFirst.QB),'earliest average first QB');
  if(qbLate)  h+=card('\u{1F9CA} Ice Cold at QB',qbLate.nick,R(qbLate.avgFirst.QB),'waits longer than anyone');
  if(teEarly) h+=card('\u{1F3AF} Loves a Tight End',teEarly.nick,R(teEarly.avgFirst.TE),'earliest average first TE');
  if(keeperKing&&keeperKing.keepers) h+=card('\u{1F512} Keeper King',keeperKing.nick,keeperKing.keepers,'most keeper picks used');
  if(topPlayers[0]) h+=card('\u{2B50} League Obsession',topPlayers[0].name,topPlayers[0].n+'×',(topPlayers[0].pos||'')+' — drafted across the league');
  h+='</div>';

  // per-manager table
  h+='<div class="table-wrap"><table class="std-table"><thead><tr><th>Manager</th><th>Drafts</th><th>1st QB</th><th>1st RB</th><th>1st WR</th><th>1st TE</th><th>R1 Lean</th><th>Keepers</th><th>Most-Drafted Player</th></tr></thead><tbody>';
  list.forEach(o=>{
    const fav=o.fav&&o.fav.n>1?`${o.fav.name} <span style="color:var(--muted)">${o.fav.n}×</span>`:(o.fav?o.fav.name:'—');
    const lean=o.r1top?`${o.r1top.pos} <span style="color:var(--muted)">${Math.round(o.r1top.pct*100)}%</span>`:'—';
    h+=`<tr><td style="font-weight:600">${nameLink(o.nick)}</td><td>${o.drafts}</td>`+
       `<td>${R(o.avgFirst.QB)}</td><td>${R(o.avgFirst.RB)}</td><td>${R(o.avgFirst.WR)}</td><td>${R(o.avgFirst.TE)}</td>`+
       `<td>${lean}</td><td>${o.keepers||'—'}</td><td style="font-size:12px">${fav}</td></tr>`;
  });
  h+='</tbody></table></div>';

  // most drafted players league-wide
  h+='<div class="dna-sub">Most-Drafted Players, All-Time</div><div class="dna-players">';
  topPlayers.forEach(p=>{
    const top=Object.entries(p.mgrs).sort((a,b)=>b[1]-a[1])[0];
    h+=`<div class="dna-pl"><div class="dna-pl-n">${p.name}</div><div class="dna-pl-m">${p.pos||''} · ${p.n} times</div><div class="dna-pl-d">most by ${top?top[0]+' ('+top[1]+')':'—'}</div></div>`;
  });
  h+='</div>';
  el.innerHTML=h;
}
